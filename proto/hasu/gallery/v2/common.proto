syntax = "proto3";

package hasu.gallery.v2;

enum ContentKind {
  CONTENT_KIND_UNSPECIFIED = 0;
  CONTENT_KIND_MEME = 1;
  CONTENT_KIND_ART = 2;
  CONTENT_KIND_FICTION = 3;
}

enum ContentRating {
  CONTENT_RATING_UNSPECIFIED = 0;
  CONTENT_RATING_ALL_AGES = 1;
  CONTENT_RATING_R15 = 2;
  CONTENT_RATING_R18 = 3;
}

message FieldViolation {
  string field = 1;
  string description = 2;
  string reason = 3;
}

message ErrorResponse {
  string code = 1;
  string message_key = 2;
  string message = 3;
  string request_id = 4;
  repeated FieldViolation field_violations = 5;
}

message HealthResponse {
  string status = 1;
  string version = 2;
  string api = 3;
}
